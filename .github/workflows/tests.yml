name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `check:rules --base` compara contra la rama base y necesita su
          # historial: con el clon superficial de 1 commit no existe.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: no hace falta Electron ni sus binaries para lint/typecheck/test.
      - run: npm ci --ignore-scripts

      # Barato y primero: si el índice quedó fijado a un árbol viejo, lo que
      # sigue se estaría midiendo sobre otra foto. En un checkout limpio pasa
      # sin hacer nada; protege las ramas donde alguien corre el flujo local.
      - name: Índice de git sano
        run: npm run check:index

      # Gate de seguridad sobre lo que de verdad se empaqueta y se sirve.
      # Se omite dev a propósito: la cadena de tooling (ESLint, electron-builder)
      # arrastra un aviso de minimatch que sólo se parchea en la 11, y esa major
      # rompe glob@7 dentro del empaquetador de Electron. El audit completo no
      # puede estar en cero sin publicar una app vacía; el detalle está en
      # README § Dependencias y auditoría.
      # El script reintenta una vez si el fallo es de red y nunca si hay avisos.
      - name: Auditoría de dependencias (producción)
        run: npx tsx scripts/audit-prod.ts

      - name: Lint (ESLint)
        run: npx eslint src

      # Contra la rama base, no contra HEAD: en CI el árbol de trabajo ES el
      # commit que se mide, así que comparar con HEAD siempre daría cero.
      - name: Reglas del repo (sin deuda nueva)
        run: npm run check:rules -- --base origin/${{ github.base_ref || 'main' }}

      - name: Tipos (tsc --noEmit)
        run: npm run typecheck

      # `npm ci` instala el paquete de Playwright pero no sus navegadores. Los
      # tests de browser del servidor lanzan Chromium, así que hay que bajarlo
      # antes de la suite de node:test.
      - name: Instala Chromium para los tests de browser
        run: npx playwright install chromium

      # node:test va antes de Vitest para que esta suite no se salte: en Actions
      # un paso que falla aborta los siguientes.
      - name: Tests (node:test)
        run: npm run test:node

      - name: Tests (Vitest)
        run: npm run test

  # Sólo el proyecto `node` de Vitest (tests/unit + tests/mcp): lógica pura, sin
  # jsdom ni polyfills de UI. No lleva `needs` a propósito —corre en paralelo a
  # `lint-and-test`— para que un fallo de lógica llegue en un par de minutos en
  # vez de detrás de la suite de UI. No sustituye a `npm run test`: el job
  # completo sigue siendo el que gatea el build.
  logic:
    name: Vitest (sólo lógica)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Tests de lógica (Vitest, proyecto node)
        run: npm run test:logic

  build:
    name: Build
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build (Vite)
        run: npm run build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Empaquetado real, sin instalar nada: `--dir` corre el mismo pipeline que una
  # release (asar, extraResources, módulos nativos) pero no genera instaladores
  # ni publica. Es el paso que se rompió con node-pty: electron-builder intentó
  # recompilarlo con node-gyp y el build falló sin que ningún test lo notara.
  package:
    name: Package (Electron, --dir)
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Sin scripts: no hacen falta los binarios de Electron para compilar, y
      # electron-builder se baja su propia copia al empaquetar.
      - run: npm ci --ignore-scripts

      - name: Build web
        run: npm run build

      - name: Build server bundles
        run: npm run build:server

      # El updater viaja bundleado (el asar no lleva node_modules).
      - name: Build updater bundle
        run: npm run build:updater

      - name: Empaquetar (electron-builder --dir)
        run: npx electron-builder --win --x64 --dir

  e2e:
    name: E2E Tests (Playwright)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build (Vite)
        run: npm run build

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
