name: CI

on:
  push:
    branches: [main, develop]
  # Sin filtro de base: un PR apilado (el head de un PR es la base del
  # siguiente) también se testea. Lo caro —build, package y E2E— queda
  # limitado a los PRs contra `main` para no multiplicar minutos de runner
  # por cada nivel del stack (ver el `if:` de esos jobs). Los borradores no
  # gastan nada hasta que se marcan "Ready for review".
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Un push nuevo sobre el mismo PR cancela la corrida anterior: ese árbol ya
# no interesa. En `push` no se cancela, para no cortar una release a medias.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
        with:
          # `check:rules --base` compara contra la rama base y necesita su
          # historial: con el clon superficial de 1 commit no existe.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: no hace falta Electron ni sus binaries para lint/typecheck/test.
      - run: npm ci --ignore-scripts

      # Barato y primero: si el índice quedó fijado a un árbol viejo, lo que
      # sigue se estaría midiendo sobre otra foto. En un checkout limpio pasa
      # sin hacer nada; protege las ramas donde alguien corre el flujo local.
      - name: Índice de git sano
        run: npm run check:index

      # La firma única se rompe sin que nada compile distinto: cualquier
      # herramienta puede volver a pegar su trailer. Se revisa el historial
      # completo, que en este job no es superficial (fetch-depth: 0).
      - name: Firmas de los commits
        run: npm run check:commit-signature

      # Hermano sin red de `sync:issue-status`: aquél pregunta a GitHub y gasta
      # cuota; éste compara la tabla con el cuerpo versionado, así que también
      # puede correr en el PR de un fork sin token.
      - name: Criterios de los issues cerrados
        run: npm run check:criteria

      # Gate de seguridad sobre lo que de verdad se empaqueta y se sirve.
      # Se omite dev a propósito: la cadena de tooling (ESLint, electron-builder)
      # arrastra un aviso de minimatch que sólo se parchea en la 11, y esa major
      # rompe glob@7 dentro del empaquetador de Electron. El audit completo no
      # puede estar en cero sin publicar una app vacía; el detalle está en
      # README § Dependencias y auditoría.
      # El script reintenta una vez si el fallo es de red y nunca si hay avisos.
      - name: Auditoría de dependencias (producción)
        run: npx tsx scripts/audit-prod.ts

      - name: Lint (ESLint)
        run: npx eslint src

      # Contra la rama base, no contra HEAD: en CI el árbol de trabajo ES el
      # commit que se mide, así que comparar con HEAD siempre daría cero.
      - name: Reglas del repo (sin deuda nueva)
        run: npm run check:rules -- --base origin/${{ github.base_ref || 'main' }}

      - name: Tipos (tsc --noEmit)
        run: npm run typecheck

      # `prepack` construye el bundle del CLI, pero ningún job empaquetaba:
      # un `bin`, un `files` o un banner roto pasaba inadvertido hasta publicar.
      # Barato aquí porque `npm ci` ya está hecho. El segundo paso corre
      # `npm pack` y arranca el ejecutable empaquetado.
      - name: Bundle del CLI (build:cli)
        run: npm run build:cli

      - name: Paquete del CLI (npm pack + smoke)
        run: npm run check:cli-package

      # `npm ci` instala el paquete de Playwright pero no sus navegadores. Los
      # tests de browser del servidor lanzan Chromium, así que hay que bajarlo
      # antes de la suite de node:test.
      - name: Instala Chromium para los tests de browser
        run: npx playwright install chromium

      # node:test va antes de Vitest para que esta suite no se salte: en Actions
      # un paso que falla aborta los siguientes.
      - name: Tests (node:test)
        run: npm run test:node

      - name: Tests (Vitest)
        run: npm run test

  # Sólo el proyecto `node` de Vitest (tests/unit + tests/mcp): lógica pura, sin
  # jsdom ni polyfills de UI. No lleva `needs` a propósito —corre en paralelo a
  # `lint-and-test`— para que un fallo de lógica llegue en un par de minutos en
  # vez de detrás de la suite de UI. No sustituye a `npm run test`: el job
  # completo sigue siendo el que gatea el build.
  logic:
    name: Vitest (sólo lógica)
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Tests de lógica (Vitest, proyecto node)
        run: npm run test:logic

  build:
    name: Build
    needs: lint-and-test
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build (Vite)
        run: npm run build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Empaquetado real, sin instalar nada: `--dir` corre el mismo pipeline que una
  # release (asar, extraResources, módulos nativos) pero no genera instaladores
  # ni publica. Es el paso que se rompió con node-pty: electron-builder intentó
  # recompilarlo con node-gyp y el build falló sin que ningún test lo notara.
  package:
    name: Package (Electron, --dir)
    needs: lint-and-test
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Sin scripts: no hacen falta los binarios de Electron para compilar, y
      # electron-builder se baja su propia copia al empaquetar.
      - run: npm ci --ignore-scripts

      - name: Build web
        run: npm run build

      - name: Build server bundles
        run: npm run build:server

      # El updater viaja bundleado (el asar no lleva node_modules).
      - name: Build updater bundle
        run: npm run build:updater

      # El mismo comando que documenta el README para armar el paquete
      # local: si `build:electron` y el pipeline de una release divergen,
      # se ve acá.
      - name: Empaquetar (build:electron --dir)
        run: npm run build:electron -- --dir --x64

      # Empaquetar en verde no prueba que las piezas estén dentro: se mira
      # el resultado. node-pty viaja en `extraResources` (el asar no lleva
      # node_modules) y server.cjs tiene que quedar al lado.
      - name: Contenido del paquete (node-pty y server.cjs)
        run: npm run check:electron-package

  e2e:
    name: E2E Tests (Playwright)
    needs: build
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build (Vite)
        run: npm run build

      # El E2E del artifact necesita `server.ts` real y Chromium; se ejecuta
      # primero para que su fallo no quede enterrado en la suite completa.
      # Cada paso escribe su propio blob: el reporter HTML limpia su carpeta al
      # arrancar, así que compartirla borraría el resultado del paso anterior.
      - name: Run agent verification E2E (Chromium)
        run: npx playwright test tests/e2e/agentVerificationArtifact.spec.ts --project=chromium --reporter=blob,list
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/agent
          PLAYWRIGHT_BLOB_OUTPUT_NAME: agent.zip

      # La suite general excluye ese spec porque ya corrió arriba; en Firefox y
      # móvil se salta por diseño.
      - name: Run Playwright tests
        run: npx playwright test --grep-invert "Artifacts de verificación · productor real" --reporter=blob,list
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/general
          PLAYWRIGHT_BLOB_OUTPUT_NAME: general.zip

      # Los dos blobs se fusionan en un único HTML + JSON para que el artifact
      # incluya también el E2E del artifact, no sólo la suite general.
      - name: Merge Playwright reports
        if: always()
        shell: bash
        run: |
          rm -rf blob-report/all
          mkdir -p blob-report/all
          cp blob-report/agent/agent.zip blob-report/all/ 2>/dev/null || true
          cp blob-report/general/general.zip blob-report/all/ 2>/dev/null || true
          npx playwright merge-reports --reporter=html,json blob-report/all
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/results.json

      # El merge puede terminar en verde con un blob perdido (por ejemplo, si
      # un paso no escribió el suyo). El conteo exacto convierte esa pérdida en
      # un fallo del job; el upload posterior sigue corriendo con `if: always()`
      # para poder inspeccionar el reporte igualmente.
      - name: Verify merged Playwright report
        if: always()
        run: npm run check:playwright-report

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
