name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: no hace falta Electron ni sus binaries para lint/typecheck/test.
      - run: npm ci --ignore-scripts

      # Barato y primero: si el índice quedó fijado a un árbol viejo, lo que
      # sigue se estaría midiendo sobre otra foto. En un checkout limpio pasa
      # sin hacer nada; protege las ramas donde alguien corre el flujo local.
      - name: Índice de git sano
        run: npm run check:index

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tipos (tsc --noEmit)
        run: npm run typecheck

      # node:test va antes de Vitest para que esta suite no se salte: en Actions
      # un paso que falla aborta los siguientes.
      - name: Tests (node:test)
        run: npm run test:node

      - name: Tests (Vitest)
        run: npm run test

  build:
    name: Build
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build (Vite)
        run: npm run build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E Tests (Playwright)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build (Vite)
        run: npm run build

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
