name: CI

on:
  push:
    branches: [main, develop]
  # Sin filtro de base: un PR apilado (el head de un PR es la base del
  # siguiente) también se testea. Lo caro —build, package y E2E— queda
  # limitado a los PRs contra `main` para no multiplicar minutos de runner
  # por cada nivel del stack (ver el `if:` de esos jobs). Los borradores no
  # gastan nada hasta que se marcan "Ready for review".
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Un push nuevo sobre el mismo PR cancela la corrida anterior: ese árbol ya
# no interesa. En `push` no se cancela, para no cortar una release a medias.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    # 4x lo medido en #289 (5m02s): npm ci en frío, node:test y Vitest.
    timeout-minutes: 20
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
        with:
          # `check:rules --base` compara contra la rama base y necesita su
          # historial: con el clon superficial de 1 commit no existe.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: no hace falta Electron ni sus binaries para lint/typecheck/test.
      - run: npm ci --ignore-scripts

      # Barato y primero: si el índice quedó fijado a un árbol viejo, lo que
      # sigue se estaría midiendo sobre otra foto. En un checkout limpio pasa
      # sin hacer nada; protege las ramas donde alguien corre el flujo local.
      - name: Índice de git sano
        run: npm run check:index

      # La firma única se rompe sin que nada compile distinto: cualquier
      # herramienta puede volver a pegar su trailer. Se revisa el historial
      # completo, que en este job no es superficial (fetch-depth: 0).
      - name: Firmas de los commits
        run: npm run check:commit-signature

      # Hermano sin red de `sync:issue-status`: aquél pregunta a GitHub y gasta
      # cuota; éste compara la tabla con el cuerpo versionado, así que también
      # puede correr en el PR de un fork sin token.
      - name: Criterios de los issues cerrados
        run: npm run check:criteria

      # Gate de seguridad sobre lo que de verdad se empaqueta y se sirve.
      # Se omite dev a propósito: la cadena de tooling (ESLint, electron-builder)
      # arrastra un aviso de minimatch que sólo se parchea en la 11, y esa major
      # rompe glob@7 dentro del empaquetador de Electron. El audit completo no
      # puede estar en cero sin publicar una app vacía; el detalle está en
      # README § Dependencias y auditoría.
      # El script reintenta una vez si el fallo es de red y nunca si hay avisos.
      - name: Auditoría de dependencias (producción)
        run: npx tsx scripts/audit-prod.ts

      - name: Lint (ESLint)
        run: npx eslint src

      # Contra la rama base, no contra HEAD: en CI el árbol de trabajo ES el
      # commit que se mide, así que comparar con HEAD siempre daría cero.
      - name: Reglas del repo (sin deuda nueva)
        run: npm run check:rules -- --base origin/${{ github.base_ref || 'main' }}

      - name: Tipos (tsc --noEmit)
        run: npm run typecheck

      # `check:cli-package` construye la UI, corre `npm pack` (que dispara
      # `prepack` → `build:cli`) e instala/arranca el ejecutable. No hay paso
      # separado de `build:cli`: en un checkout limpio falta `dist/` y el guard
      # de la UI corta antes de empaquetar.
      - name: Paquete del CLI (build + npm pack + smoke)
        run: npm run check:cli-package

      # `npm ci` instala el paquete de Playwright pero no sus navegadores. Los
      # tests de browser del servidor lanzan Chromium, así que hay que bajarlo
      # antes de la suite de node:test.
      - name: Instala Chromium para los tests de browser
        run: npx playwright install chromium

      # node:test va antes de Vitest para que esta suite no se salte: en Actions
      # un paso que falla aborta los siguientes.
      - name: Tests (node:test)
        run: npm run test:node
        env:
          # Los conteos sólo se veían abriendo el log del paso, y sin sesión ese
          # log no se puede leer: el reporter JUnit los deja en un archivo que
          # `ci:summary` vuelca en el resumen del job.
          TEST_NODE_JUNIT: .ci/node-test.xml

      # `always()`: con la suite en rojo el resumen es justo lo que hace falta.
      - name: Resumen (node:test)
        if: always()
        run: npm run ci:summary -- node-test

      # El log del paso no se puede leer sin sesión en el repo: con `tee` la
      # salida del reporter queda en un archivo que se sube como artefacto si
      # el paso falla. `pipefail` conserva el código de salida real de Vitest,
      # que `tee` se comería.
      - name: Tests (Vitest)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci
          npm run test -- --reporter=default --reporter=json --outputFile=.ci/vitest.json 2>&1 | tee .ci/vitest-output.log

      - name: Resumen (Vitest)
        if: always()
        run: npm run ci:summary -- vitest

      # Diagnóstico del rojo opaco: `exit code 1` sin test nombrado no dice qué
      # rompió. El JSON conserva el nombre y el mensaje de cada fallo.
      - name: Artefactos de Vitest (diagnóstico)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-diagnostico
          path: |
            .ci/vitest.json
            .ci/vitest-output.log
          if-no-files-found: warn
          retention-days: 7

  # Sólo el proyecto `node` de Vitest (tests/unit + tests/mcp): lógica pura, sin
  # jsdom ni polyfills de UI. No lleva `needs` a propósito —corre en paralelo a
  # `lint-and-test`— para que un fallo de lógica llegue en un par de minutos en
  # vez de detrás de la suite de UI. No sustituye a `npm run test`: el job
  # completo sigue siendo el que gatea el build.
  logic:
    name: Vitest (sólo lógica)
    # ~9x lo medido (1m45s): es el job de feedback rápido, no el que se estira.
    timeout-minutes: 15
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # Mismo `tee` + `pipefail` que en `lint-and-test`: sin sesión, el log del
      # paso no se ve, y este job es el que viene fallando con `exit code 1`.
      - name: Tests de lógica (Vitest, proyecto node)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci
          npm run test:logic -- --reporter=default --reporter=json --outputFile=.ci/vitest.json 2>&1 | tee .ci/vitest-output.log

      # Los conteos de este job tampoco se ven sin sesión: van al resumen.
      # `--title`: acá sólo corre el proyecto node, así que el rótulo lo aclara.
      - name: Resumen (Vitest, lógica)
        if: always()
        run: npm run ci:summary -- vitest --title "Tests (Vitest, lógica)"

      - name: Artefactos de Vitest (diagnóstico)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-logica-diagnostico
          path: |
            .ci/vitest.json
            .ci/vitest-output.log
          if-no-files-found: warn
          retention-days: 7

  # Sin job de `build`: `npm run build` es sólo el `vite build`, y `package`
  # (paso `Build web`) y `e2e` ya lo corren cada uno, junto a lo que de verdad
  # necesitan (bundles del server/updater, preview). Como job aparte costaba un
  # `npm ci` y 2m10s de runner por corrida sin adelantar nada: no está en el
  # camino crítico —el `e2e` manda— ni nadie consume su salida.
  # Empaquetado real, sin instalar nada: `--dir` corre el mismo pipeline que una
  # release (asar, extraResources, módulos nativos) pero no genera instaladores
  # ni publica. Es el paso que se rompió con node-pty: electron-builder intentó
  # recompilarlo con node-gyp y el build falló sin que ningún test lo notara.
  package:
    name: Package (Electron, --dir)
    # ~10x lo medido (1m30s): electron-builder es el que puede quedarse esperando.
    timeout-minutes: 15
    needs: lint-and-test
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Sin scripts: no hacen falta los binarios de Electron para compilar, y
      # electron-builder se baja su propia copia al empaquetar.
      - run: npm ci --ignore-scripts

      - name: Build web
        run: npm run build

      - name: Build server bundles
        run: npm run build:server

      # El updater viaja bundleado (el asar no lleva node_modules).
      - name: Build updater bundle
        run: npm run build:updater

      # El mismo comando que documenta el README para armar el paquete
      # local: si `build:electron` y el pipeline de una release divergen,
      # se ve acá.
      - name: Empaquetar (build:electron --dir)
        run: npm run build:electron -- --dir --x64

      # Empaquetar en verde no prueba que las piezas estén dentro: se mira
      # el resultado. node-pty viaja en `extraResources` (el asar no lleva
      # node_modules) y server.cjs tiene que quedar al lado.
      - name: Contenido del paquete (node-pty y server.cjs)
        run: npm run check:electron-package

  e2e:
    name: E2E Tests (Playwright)
    # El más largo: 11m10s en #289, con 2m51s de navegadores en frío y 6m13s de
    # suite. Un reintento (`retries: 1`) puede volver a correrla casi entera, así
    # que 30 deja margen para el peor caso normal y corta un preview colgado.
    timeout-minutes: 30
    # No espera a `build`: su artifact `dist` no lo descarga ningún job y este
    # job reconstruye la UI por su cuenta (paso `Build (Vite)` más abajo).
    # Colgarlo del build lo dejaba 2m19s detrás de un producto que ignora; lo
    # único que necesita es el árbol en verde.
    needs: lint-and-test
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # `playwright install --with-deps` es el paso más caro del job (4m13s en
      # #290) y casi todo se va en el DISM de Media Foundation, no en la
      # descarga. La clave cuelga del lockfile: subir Playwright o cualquiera de
      # sus dependencias invalida el cache y el paso vuelve a instalar con deps.
      # Con cache caliente no se corre el paso; si un test de media fallara justo
      # así, el culpable es el DISM que no corrió: quitar el `if:` de abajo lo
      # devuelve sin tocar el cache.
      - name: Cache de navegadores de Playwright (restore)
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        id: playwright-install
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox

      # Guardar va aparte y con `always()`: el post de `actions/cache` no corre
      # si un paso anterior falló —#290, rojo en el gate, no guardó nada— y
      # `save-always` está deprecado. Así un run rojo igual deja los navegadores
      # para el siguiente, pero sólo si la instalación terminó entera: media
      # carpeta cacheada dejaría los runs siguientes sin navegadores.
      - name: Cache de navegadores de Playwright (save)
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true' && steps.playwright-install.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Build (Vite)
        run: npm run build

      # El E2E del artifact necesita `server.ts` real y Chromium; se ejecuta
      # primero para que su fallo no quede enterrado en la suite completa.
      # Cada paso escribe su propio blob: el reporter HTML limpia su carpeta al
      # arrancar, así que compartirla borraría el resultado del paso anterior.
      - name: Run agent verification E2E (Chromium)
        run: npx playwright test tests/e2e/agentVerificationArtifact.spec.ts --project=chromium --reporter=blob,list
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/agent
          PLAYWRIGHT_BLOB_OUTPUT_NAME: agent.zip

      # La suite general excluye ese spec porque ya corrió arriba; en Firefox y
      # móvil se salta por diseño.
      - name: Run Playwright tests
        run: npx playwright test --grep-invert "Artifacts de verificación · productor real" --reporter=blob,list
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/general
          PLAYWRIGHT_BLOB_OUTPUT_NAME: general.zip

      # Los dos blobs se fusionan en un único HTML + JSON para que el artifact
      # incluya también el E2E del artifact, no sólo la suite general.
      - name: Merge Playwright reports
        if: always()
        shell: bash
        run: |
          rm -rf blob-report/all
          mkdir -p blob-report/all
          cp blob-report/agent/agent.zip blob-report/all/ 2>/dev/null || true
          cp blob-report/general/general.zip blob-report/all/ 2>/dev/null || true
          npx playwright merge-reports --reporter=html,json blob-report/all
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/results.json

      # La racha de flaky viaja entre corridas en el cache: el gate deja
      # `.flaky-state.json` con lo que vio y el run siguiente lo restaura. Sin
      # cache (primera corrida, o expirado) la racha arranca de cero, así que el
      # peor caso es perder un aviso, nunca inventar un rojo.
      - name: Cache de flaky (restore)
        id: flaky-cache
        uses: actions/cache/restore@v6
        with:
          path: .flaky-state.json
          key: flaky-${{ github.run_id }}
          restore-keys: flaky-

      # El merge puede terminar en verde con un blob perdido (por ejemplo, si
      # un paso no escribió el suyo). El conteo exacto convierte esa pérdida en
      # un fallo del job; el upload posterior sigue corriendo con `if: always()`
      # para poder inspeccionar el reporte igualmente.
      - name: Verify merged Playwright report
        if: always()
        run: npm run check:playwright-report
        env:
          FLAKY_STATE: .flaky-state.json

      # El guardado va aparte y con `always()`: el run que más importa es justo
      # el rojo (tercer flaky seguido), y ahí la racha tiene que llegar al
      # siguiente. `hashFiles` evita que el save falle si el gate no llegó a
      # escribir el archivo (artifact roto antes del veredicto).
      - name: Cache de flaky (save)
        if: always() && hashFiles('.flaky-state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .flaky-state.json
          key: flaky-${{ github.run_id }}

      # Los conteos del merge tampoco se ven sin sesión: van al resumen del job.
      - name: Resumen (E2E)
        if: always()
        run: npm run ci:summary -- e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
