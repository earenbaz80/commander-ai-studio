name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (Vite)
        run: npm run build

      # Los bundles del servidor se regeneran aquí: el release empaqueta
      # electron/server.cjs y server.mjs, y sin este paso se publicaría el que
      # quedó commiteado, que puede ser de una versión anterior.
      - name: Build server bundles
        run: npm run build:server

      # Windows firma con su propio .pfx. El .p12 de Apple no se le pasa: en un
      # runner de Windows haría fallar la firma por certificado equivocado.
      - name: Build Electron App (Windows)
        if: runner.os == 'Windows'
        run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}

      - name: Build Electron App (macOS/Linux)
        if: runner.os != 'Windows'
        run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # Un tag no publica instaladores sin firmar. Sin secreto de certificado,
      # electron-builder genera el .exe igual y sólo avisa; aquí se corta.
      # Para una prerelease sin certificado: SIGNING_OPTIONAL=1 en el job.
      - name: Verificar firma (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-signing.cjs --require --dir release

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
