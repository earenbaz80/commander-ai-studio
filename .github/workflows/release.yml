name: Build & Release

# action-gh-release publica con el GITHUB_TOKEN, que hereda los permisos por
# defecto del repo; si están en sólo lectura el tag termina en 403. Se declara.
permissions:
  contents: write
  actions: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # El tag no puede publicar un commit que no pasó CI ni que no esté en main.
  # Se comprueba antes de gastar los tres runners del build.
  verify:
    name: Gate de release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verificar versión del tag contra package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version=$(node -p "require('./package.json').version")
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::El tag $tag no tiene el formato vX.Y.Z."
            exit 1
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::El tag $tag no coincide con package.json ($version); se esperaba v$version."
            exit 1
          fi
          echo "Tag $tag coincide con package.json."

      - name: Verificar que el commit está en main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El commit $GITHUB_SHA no está en main; una release sólo sale de main."
            exit 1
          fi
          echo "Commit $GITHUB_SHA en main."

      - name: Verificar CI verde del commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?head_sha=${GITHUB_SHA}&event=push&branch=main&status=success&per_page=1" --jq '.workflow_runs | length')
          if [ "$runs" -eq 0 ]; then
            echo "::error::El commit $GITHUB_SHA no tiene una corrida exitosa de tests.yml en un push a main. Esperá a que CI termine y relanzá este workflow."
            exit 1
          fi
          echo "CI verde para $GITHUB_SHA."

  build-release:
    name: Build & Release
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (Vite)
        run: npm run build

      # Los bundles del servidor se regeneran aquí: el release empaqueta
      # electron/server.cjs y server.mjs, y sin este paso se publicaría el que
      # quedó commiteado, que puede ser de una versión anterior.
      - name: Build server bundles
        run: npm run build:server

      # El updater viaja bundleado (el asar no lleva node_modules).
      - name: Build updater bundle
        run: npm run build:updater

      # Sin firma a propósito: es una app personal y no hay certificado. El
      # instalador sale NotSigned y SmartScreen avisa la primera vez.
      - name: Build Electron App (Windows)
        if: runner.os == 'Windows'
        run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # build:electron escribe --win: en Linux eso intenta un NSIS de Windows y
      # electron-builder necesita wine, que el runner no trae (ENOENT). Cada
      # sistema compila su propio formato.
      - name: Build Electron App (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron App (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Antes había aquí un `check-signing --require` que cortaba el tag si
      # los .exe no estaban firmados. Se quitó: el proyecto es personal y sin
      # certificado el gate sólo bloqueaba releases legítimas. El script sigue
      # disponible para inspeccionar a mano.

      - name: Checksums SHA-256
        run: node scripts/release-checksums.mjs

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.yml
            release/SHA256SUMS-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
