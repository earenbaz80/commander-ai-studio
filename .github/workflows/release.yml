name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (Vite)
        run: npm run build

      # Los bundles del servidor se regeneran aquí: el release empaqueta
      # electron/server.cjs y server.mjs, y sin este paso se publicaría el que
      # quedó commiteado, que puede ser de una versión anterior.
      - name: Build server bundles
        run: npm run build:server

      # El updater viaja bundleado (el asar no lleva node_modules).
      - name: Build updater bundle
        run: npm run build:updater

      # Sin firma a propósito: es una app personal y no hay certificado. El
      # instalador sale NotSigned y SmartScreen avisa la primera vez.
      - name: Build Electron App (Windows)
        if: runner.os == 'Windows'
        run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron App (macOS/Linux)
        if: runner.os != 'Windows'
        run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Antes había aquí un `check-signing --require` que cortaba el tag si
      # los .exe no estaban firmados. Se quitó: el proyecto es personal y sin
      # certificado el gate sólo bloqueaba releases legítimas. El script sigue
      # disponible para inspeccionar a mano.

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
