<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Commander AI Studio</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./app-icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#000080" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CommanderAI" />
    <meta name="description" content="Entorno de desarrollo de IA avanzado con Commander AI, modelos locales de Hugging Face y exportador de aplicaciones nativas para Windows y Android." />
    <meta property="og:title" content="Commander AI Studio" />
    <meta property="og:description" content="Entorno de desarrollo de IA avanzado con Commander AI, modelos locales de Hugging Face y exportador de aplicaciones nativas para Windows y Android." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      La hoja de Google Fonts bloqueaba el render ~3,2 s (medido): hasta que no
      llegaba no se pintaba nada. Se pide como `print` y se cambia a `all` al
      cargar, así el CSS no bloquea; las fuentes ya usan `display=swap`, con lo
      que el texto se pinta con la de respaldo y hace el intercambio después.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap"
    >
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap"
      media="print"
      onload="this.media='all'"
    >
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap"
      >
    </noscript>
  </head>
  <body class="bg-[#131314] text-[#e3e2e6] font-sans antialiased selection:bg-[#383d47] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
