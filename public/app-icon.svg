<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0000a8"/>
      <stop offset="50%" stop-color="#000078"/>
      <stop offset="100%" stop-color="#000048"/>
    </linearGradient>

    <!-- Bevel & Neon Gradients -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#55ffff"/>
    </linearGradient>
    
    <linearGradient id="yellowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffff55"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Squircle / Icon Base -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="#000030" filter="url(#softShadow)" />
  
  <!-- Outer Bevel Edge (DOS Retro 3D Style) -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="url(#bgGrad)" stroke="#00ffff" stroke-width="8"/>
  <rect x="44" y="44" width="424" height="424" rx="76" fill="none" stroke="#0055aa" stroke-width="4"/>

  <!-- Norton Commander CRT Titlebar Frame -->
  <path d="M 64 64 L 448 64 L 448 116 L 64 116 Z" fill="#00aaaa" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Retro Window Controls -->
  <rect x="76" y="78" width="22" height="22" fill="#000080" stroke="#00ffff" stroke-width="2"/>
  <text x="87" y="94" font-family="monospace" font-size="16" font-weight="900" fill="#ffff55" text-anchor="middle">■</text>

  <rect x="110" y="78" width="22" height="22" fill="#000080" stroke="#00ffff" stroke-width="2"/>
  <text x="121" y="94" font-family="monospace" font-size="16" font-weight="900" fill="#00ffff" text-anchor="middle">▲</text>

  <!-- Title Text -->
  <text x="270" y="96" font-family="monospace, 'Courier New', Courier" font-size="20" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="2">
    COMMANDER • AI
  </text>

  <rect x="414" y="78" width="22" height="22" fill="#aa0000" stroke="#ffffff" stroke-width="2"/>
  <text x="425" y="94" font-family="monospace" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">X</text>

  <!-- Dual Split Panels (Norton Commander Left / Right Pane) -->
  <!-- Left Panel -->
  <rect x="64" y="128" width="186" height="280" fill="#000055" stroke="#00aaaa" stroke-width="4"/>
  <path d="M 64 128 L 250 128 L 250 156 L 64 156 Z" fill="#008888"/>
  <text x="157" y="148" font-family="monospace" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">LEFT: PROMPTS</text>

  <!-- Left Code / Directory Rows -->
  <line x1="76" y1="180" x2="160" y2="180" stroke="#00ffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="76" y1="205" x2="190" y2="205" stroke="#ffff55" stroke-width="5" stroke-linecap="round"/>
  <line x1="76" y1="230" x2="140" y2="230" stroke="#55ff55" stroke-width="5" stroke-linecap="round"/>
  <line x1="76" y1="255" x2="175" y2="255" stroke="#00ffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="76" y1="280" x2="130" y2="280" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Right Panel -->
  <rect x="262" y="128" width="186" height="280" fill="#000055" stroke="#00aaaa" stroke-width="4"/>
  <path d="M 262 128 L 448 128 L 448 156 L 262 156 Z" fill="#008888"/>
  <text x="355" y="148" font-family="monospace" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">RIGHT: MODELS</text>

  <!-- Right Code / Model Metrics Rows -->
  <line x1="274" y1="180" x2="380" y2="180" stroke="#ffff55" stroke-width="5" stroke-linecap="round"/>
  <line x1="274" y1="205" x2="340" y2="205" stroke="#00ffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="274" y1="230" x2="410" y2="230" stroke="#ff55ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="274" y1="255" x2="330" y2="255" stroke="#55ffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="274" y1="280" x2="390" y2="280" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Center Floating Microprocessor & AI Neural Core -->
  <circle cx="256" cy="300" r="82" fill="#000030" stroke="#00ffff" stroke-width="6" filter="url(#glow)"/>
  <circle cx="256" cy="300" r="72" fill="#000060" stroke="#ffff55" stroke-width="3"/>

  <!-- Microprocessor Circuit Lines -->
  <path d="M 256 218 L 256 195 M 256 382 L 256 405 M 174 300 L 150 300 M 338 300 L 362 300" stroke="#00ffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 198 242 L 180 224 M 314 358 L 332 376 M 198 358 L 180 376 M 314 242 L 332 224" stroke="#ffff55" stroke-width="4" stroke-linecap="round"/>

  <!-- Neural Sparks / Central AI Core -->
  <polygon points="256,242 278,284 324,284 286,312 300,358 256,330 212,358 226,312 188,284 234,284" fill="url(#yellowGlow)" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Glowing Center Eye -->
  <circle cx="256" cy="300" r="16" fill="#000060" stroke="#00ffff" stroke-width="4"/>
  <circle cx="256" cy="300" r="8" fill="#00ffff" filter="url(#glow)"/>

  <!-- Bottom Function Key Bar (DOS Style F1-F10) -->
  <path d="M 64 420 L 448 420 L 448 450 L 64 450 Z" fill="#000000" stroke="#00ffff" stroke-width="3"/>
  <text x="80" y="440" font-family="monospace" font-size="12" font-weight="900" fill="#ffffff">F1</text>
  <text x="100" y="440" font-family="monospace" font-size="12" font-weight="bold" fill="#00ffff">Help</text>

  <text x="150" y="440" font-family="monospace" font-size="12" font-weight="900" fill="#ffffff">F2</text>
  <text x="170" y="440" font-family="monospace" font-size="12" font-weight="bold" fill="#00ffff">Prompt</text>

  <text x="235" y="440" font-family="monospace" font-size="12" font-weight="900" fill="#ffffff">F9</text>
  <text x="255" y="440" font-family="monospace" font-size="12" font-weight="bold" fill="#ffff55">Compile</text>

  <text x="330" y="440" font-family="monospace" font-size="12" font-weight="900" fill="#ffffff">F10</text>
  <text x="355" y="440" font-family="monospace" font-size="12" font-weight="bold" fill="#ff5555">Native</text>

  <!-- Corner Glare Accents -->
  <circle cx="64" cy="64" r="8" fill="#ffff55" opacity="0.8"/>
  <circle cx="448" cy="64" r="8" fill="#00ffff" opacity="0.8"/>
  <circle cx="64" cy="450" r="8" fill="#00ffff" opacity="0.8"/>
  <circle cx="448" cy="450" r="8" fill="#ffff55" opacity="0.8"/>
</svg>
